t x="674.0" y="633.5" font-size="12.5" font-weight="700" text-anchor="end" fill="#9E6C1C">¥73</text><text x="20" y="662" font-size="12" fill="#8A948E">示意图：圆点按高德真实经纬度摆放，编号与上表一致。虚线是当天行车路线（OpenStreetMap 路网，非导航实测），线上</text><text x="20" y="680" font-size="12" fill="#8A948E">的箭头＝行进方向；大圆＝地标，小金点＝停车。</text><text x="20" y="698" font-size="12" fill="#8A948E">金色菱形＝晚上住哪。10/4 当晚住云和夏秋农家乐，出景区后还要往西南</text><text x="20" y="716" font-size="12" fill="#8A948E">开 134 km，所以菱形贴在西边框上——它指的是那个方向，人不在图内。</text><text x="20" y="734" font-size="12" fill="#8A948E">色条＝人均：绿 ≤40 · 金 40–65 · 红 &gt;65。同一条街上</text><text x="20" y="752" font-size="12" fill="#8A948E">的店挤在几十米内，用一个编号胶囊表示，名字见上面那张表。</text><text x="20" y="770" font-size="12" fill="#8A948E">开车顺序：卡口 → 朱潭山望湖农庄（东）→ 六月山民宿停车、</text><text x="20" y="788" font-size="12" fill="#8A948E">看岩宕书房（西）→ 小赤壁下洋村（南）→ 出景区往西去云和。</text></svg>